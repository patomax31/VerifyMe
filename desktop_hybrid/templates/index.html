<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VerifyMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;600;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Overlay drawer -->
  <div id="drawerOverlay" class="drawer-overlay"></div>

  <!-- Drawer -->
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="drawer-brand">
        <span class="drawer-brand__icon">🔐</span>
        <div>
          <p class="drawer-brand__name">VerifyMe</p>
          <p class="drawer-brand__sub">Biométrico escolar</p>
        </div>
      </div>
      <button id="drawerClose" class="icon-btn" aria-label="Cerrar menú">✕</button>
    </div>

    <nav class="drawer-nav">
      <button class="nav-btn" data-view="access">
        <span class="nav-btn__icon">👤</span><span data-i18n="nav_access">Acceso facial</span>
      </button>
      <button class="nav-btn" data-view="register">
        <span class="nav-btn__icon">➕</span><span data-i18n="nav_register">Registro facial</span>
      </button>
      <button class="nav-btn" data-view="admin">
        <span class="nav-btn__icon">⚙️</span><span data-i18n="nav_admin">Admin panel</span>
      </button>
    </nav>

    <button class="drawer-logout" id="logoutBtn" data-i18n="logout">🚪 Cerrar sesión</button>
  </aside>

  <!-- Layout principal -->
  <div class="app-layout">

    <!-- Topbar -->
    <header class="topbar">
      <button id="hamburger" class="icon-btn burger" aria-label="Abrir menú">☰</button>
      <div class="topbar-info">
        <p class="eyebrow">VerifyMe</p>
        <p class="topbar-title" id="topbarTitle">Panel principal</p>
      </div>
      <button class="topbar-lang" id="langBtn" aria-label="Cambiar idioma">
        <span id="langFlag">🇲🇽</span>
        <span id="langLabel">ES</span>
      </button>
      <div class="topbar-clock">
        <div id="clockH" class="clock-h">--:--</div>
        <div id="clockD" class="clock-d"></div>
      </div>
    </header>

    <main class="views-wrap">

      

      


      {% include 'partials/login.html' %}
      {% include 'partials/register.html' %}
      {% include 'partials/register_admin.html' %}
      {% include 'partials/admin.html' %}

    </main>
  </div>

  <div id="osk" class="osk hidden" aria-hidden="true">
    <div class="simple-keyboard"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
